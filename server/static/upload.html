<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Lesson — Steam on Wheels</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="screen">
    <div class="top-bar">
      <button class="back-btn" onclick="window.location.href='/'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back
      </button>
    </div>

    <div class="upload-header">
      <div class="upload-eyebrow">
        <span class="route-dot"></span>
        Teacher access
      </div>
      <div class="upload-title">Upload educational content</div>
      <div class="upload-subtitle">Enter English content below — the AI model will translate it to Bemba automatically before saving. Students won't see this screen; it's only reachable from the STEAM logo.</div>
    </div>

    <div class="field-group">
      <label class="field-label" for="etSubject">Subject</label>
      <input class="field" id="etSubject" placeholder="e.g. Science, Maths" />
    </div>

    <div class="field-group">
      <label class="field-label" for="etTopicEnglish">Topic title (English)</label>
      <input class="field" id="etTopicEnglish" placeholder="e.g. Domestic and Wild Animals" />
    </div>

    <div class="field-group">
      <label class="field-label" for="etContentEnglish">Lesson body (English)</label>
      <textarea class="field" id="etContentEnglish" placeholder="Write the lesson content here…"></textarea>
    </div>

    <button class="submit-btn" id="btnUploadTranslate">Auto-translate &amp; save</button>

    <div class="status-box" id="tvAutoTranslateStatus">
      <span class="status-label">AI status</span>
      <span id="statusText">Waiting for input…</span>
    </div>
  </div>

  <script>
    const etSubject = document.getElementById('etSubject');
    const etTopicEnglish = document.getElementById('etTopicEnglish');
    const etContentEnglish = document.getElementById('etContentEnglish');
    const btnUploadTranslate = document.getElementById('btnUploadTranslate');
    const statusText = document.getElementById('statusText');

    btnUploadTranslate.addEventListener('click', async () => {
      const subject = etSubject.value.trim();
      const topicEn = etTopicEnglish.value.trim();
      const contentEn = etContentEnglish.value.trim();

      if (!subject || !topicEn || !contentEn) {
        alert('Please fill in all fields');
        return;
      }

      statusText.textContent = 'Translating topic and content to Bemba…';
      btnUploadTranslate.disabled = true;

      try {
        const res = await fetch('/api/lessons', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ subject, topic_en: topicEn, content_en: contentEn }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `Server error (${res.status})`);
        }

        const saved = await res.json();
        statusText.textContent =
          `Saved!\n\nBemba topic: ${saved.topic_bem}\n\nBemba content:\n${saved.content_bem}`;
        alert(`Saved to ${subject}! Check the lesson screen.`);
      } catch (err) {
        statusText.textContent = `Error: ${err.message}`;
      } finally {
        btnUploadTranslate.disabled = false;
      }
    });
  </script>
</body>
</html>
