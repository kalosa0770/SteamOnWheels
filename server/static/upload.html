<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Lesson — Steam on Wheels</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link href="/static/output.css?v=3" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-bg text-navy min-h-screen flex justify-center">
  <div class="w-full max-w-md md:max-w-lg px-5 pt-8 pb-16">
    <button onclick="location.href='/teacher/dashboard'" class="flex items-center gap-1 font-display font-bold text-[15px] border-0 bg-transparent cursor-pointer"><svg viewBox="0 0 24 24" fill="none" class="w-4 h-4"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Back to dashboard</button>

    <div class="mt-6">
      <div class="flex items-center gap-2 text-orange-dark text-[11px] font-bold tracking-widest uppercase">
        <span class="w-2 h-2 rounded-full bg-orange"></span>Teacher access
      </div>
      <h1 class="font-display font-extrabold text-2xl mt-2">Upload educational content</h1>
      <p class="text-navy/55 text-sm mt-2 leading-relaxed">Write your lesson in English, translate it, then review and fix the Bemba before saving — the AI gets close, but a native check makes it read naturally.</p>
    </div>

    <div class="mt-6">
      <label class="block text-xs font-bold text-navy mb-1.5" for="etSubject">Subject</label>
      <input class="w-full px-4 py-3 rounded-xl border border-black/10 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-orange" id="etSubject" placeholder="e.g. Science, Maths" />
    </div>

    <div class="mt-4">
      <label class="block text-xs font-bold text-navy mb-1.5" for="etTopicEnglish">Topic title (English)</label>
      <input class="w-full px-4 py-3 rounded-xl border border-black/10 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-orange" id="etTopicEnglish" placeholder="e.g. Domestic and Wild Animals" />
    </div>

    <div class="mt-4">
      <label class="block text-xs font-bold text-navy mb-1.5" for="etContentEnglish">Lesson body (English)</label>
      <textarea class="w-full px-4 py-3 rounded-xl border border-black/10 bg-white text-sm min-h-32 focus:outline-none focus:ring-2 focus:ring-orange" id="etContentEnglish" placeholder="Write the lesson content here…"></textarea>
    </div>

    <button id="btnTranslate" class="w-full h-14 bg-navy-deep text-white rounded-full font-display font-bold mt-6 border-0 cursor-pointer disabled:opacity-60">Translate to Bemba</button>

    <div id="bemFields" class="hidden">
      <div class="mt-6">
        <label class="block text-xs font-bold text-navy mb-1.5" for="etTopicBemba">Topic title (Bemba) — edit if needed</label>
        <input class="w-full px-4 py-3 rounded-xl border border-black/10 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-orange" id="etTopicBemba" />
      </div>

      <div class="mt-4">
        <label class="block text-xs font-bold text-navy mb-1.5" for="etContentBemba">Lesson body (Bemba) — edit if needed</label>
        <textarea class="w-full px-4 py-3 rounded-xl border border-black/10 bg-white text-sm min-h-32 focus:outline-none focus:ring-2 focus:ring-orange" id="etContentBemba"></textarea>
      </div>

      <button id="btnSave" class="w-full h-14 bg-orange hover:bg-orange-dark text-white rounded-full font-display font-bold mt-6 border-0 cursor-pointer disabled:opacity-60">Save lesson</button>
    </div>

    <div class="mt-5 p-4 rounded-xl border border-black/10 bg-white text-sm leading-relaxed whitespace-pre-line">
      <span class="block text-[10px] font-bold text-navy/50 tracking-widest uppercase mb-1.5">Status</span>
      <span id="statusText">Waiting for input…</span>
    </div>
  </div>

  <script src="/static/auth.js?v=3"></script>
  <script>
    const etSubject = document.getElementById('etSubject');
    const etTopicEnglish = document.getElementById('etTopicEnglish');
    const etContentEnglish = document.getElementById('etContentEnglish');
    const btnTranslate = document.getElementById('btnTranslate');

    const bemFields = document.getElementById('bemFields');
    const etTopicBemba = document.getElementById('etTopicBemba');
    const etContentBemba = document.getElementById('etContentBemba');
    const btnSave = document.getElementById('btnSave');

    const statusText = document.getElementById('statusText');

    async function translateOne(text) {
      const res = await authFetch('/translate', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ inputs: text, src_lang: 'eng_Latn', tgt_lang: 'bem_Latn' }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Server error (${res.status})`);
      }
      const data = await res.json();
      return data[0]?.translation_text || '';
    }

    btnTranslate.addEventListener('click', async () => {
      const subject = etSubject.value.trim();
      const topicEn = etTopicEnglish.value.trim();
      const contentEn = etContentEnglish.value.trim();
      if (!subject || !topicEn || !contentEn) { alert('Please fill in subject, topic, and content first'); return; }

      statusText.textContent = 'Translating…';
      btnTranslate.disabled = true;
      try {
        const [topicBem, contentBem] = await Promise.all([
          translateOne(topicEn),
          translateOne(contentEn),
        ]);
        etTopicBemba.value = topicBem;
        etContentBemba.value = contentBem;
        bemFields.classList.remove('hidden');
        statusText.textContent = 'Translated — review the Bemba below, edit anything that reads awkwardly, then save.';
      } catch (err) {
        statusText.textContent = `Error: ${err.message}`;
      } finally {
        btnTranslate.disabled = false;
      }
    });

    btnSave.addEventListener('click', async () => {
      const subject = etSubject.value.trim();
      const topicEn = etTopicEnglish.value.trim();
      const contentEn = etContentEnglish.value.trim();
      const topicBem = etTopicBemba.value.trim();
      const contentBem = etContentBemba.value.trim();

      if (!topicBem || !contentBem) { alert('Bemba fields cannot be empty'); return; }

      statusText.textContent = 'Saving…';
      btnSave.disabled = true;
      try {
        const res = await authFetch('/api/lessons', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            subject, topic_en: topicEn, content_en: contentEn,
            topic_bem: topicBem, content_bem: contentBem,
          }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `Server error (${res.status})`);
        }
        statusText.textContent = `Saved to ${subject}!`;
        alert(`Saved to ${subject}! Check the lesson screen.`);

        // Reset for the next lesson
        etTopicEnglish.value = '';
        etContentEnglish.value = '';
        etTopicBemba.value = '';
        etContentBemba.value = '';
        bemFields.classList.add('hidden');
      } catch (err) {
        statusText.textContent = `Error: ${err.message}`;
      } finally {
        btnSave.disabled = false;
      }
    });

    (async () => {
      await requireAuth('teacher');
    })();
  </script>
</body>
</html>
