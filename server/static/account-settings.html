<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Settings — Steam on Wheels</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link href="/static/output.css?v=3" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-bg text-navy min-h-screen flex justify-center">
  <div class="w-full max-w-md md:max-w-lg px-5 pt-8 pb-16">
    <button id="btnBack" class="flex items-center gap-1 font-display font-bold text-[15px] border-0 bg-transparent cursor-pointer"><svg viewBox="0 0 24 24" fill="none" class="w-4 h-4"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>

    <div class="mt-6">
      <h1 class="font-display font-extrabold text-2xl mt-2">Account Settings</h1>
      <p class="text-navy/55 text-sm mt-2 leading-relaxed">Update your name or change your password.</p>
    </div>

    <!-- Name -->
    <form id="nameForm">
      <div class="mt-6">
        <label class="block text-xs font-bold text-navy mb-1.5" for="name">Full name</label>
        <input class="w-full px-4 py-3 rounded-xl border border-black/10 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-orange" id="name" required />
      </div>

      <div class="mt-4">
        <label class="block text-xs font-bold text-navy mb-1.5" for="email">Email</label>
        <input class="w-full px-4 py-3 rounded-xl border border-black/10 bg-black/5 text-sm text-navy/50" id="email" disabled />
      </div>

      <button id="btnSaveName" type="submit" class="w-full h-14 bg-orange hover:bg-orange-dark text-white rounded-full font-display font-bold mt-6 border-0 cursor-pointer disabled:opacity-60">Save name</button>

      <div id="nameStatus" class="mt-4 text-sm hidden"></div>
    </form>

    <!-- Password -->
    <form id="passwordForm">
      <div class="mt-10">
        <h2 class="font-display font-bold text-navy text-sm">Change password</h2>
      </div>

      <div class="mt-4">
        <label class="block text-xs font-bold text-navy mb-1.5" for="currentPassword">Current password</label>
        <div class="relative">
          <input class="w-full pl-4 pr-11 py-3 rounded-xl border border-black/10 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-orange" id="currentPassword" type="password" required />
          <button type="button" id="toggleCurrentPassword" aria-label="Show password" class="password-toggle-btn">
            <svg id="toggleCurrentPasswordIcon" viewBox="0 0 24 24" fill="none"><path d="M1 12S5 4.5 12 4.5 23 12 23 12 19 19.5 12 19.5 1 12 1 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
          </button>
        </div>
      </div>

      <div class="mt-4">
        <label class="block text-xs font-bold text-navy mb-1.5" for="newPassword">New password</label>
        <div class="relative">
          <input class="w-full pl-4 pr-11 py-3 rounded-xl border border-black/10 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-orange" id="newPassword" type="password" placeholder="At least 6 characters" required />
          <button type="button" id="toggleNewPassword" aria-label="Show password" class="password-toggle-btn">
            <svg id="toggleNewPasswordIcon" viewBox="0 0 24 24" fill="none"><path d="M1 12S5 4.5 12 4.5 23 12 23 12 19 19.5 12 19.5 1 12 1 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
          </button>
        </div>
      </div>

      <div class="mt-4">
        <label class="block text-xs font-bold text-navy mb-1.5" for="confirmNewPassword">Confirm new password</label>
        <div class="relative">
          <input class="w-full pl-4 pr-11 py-3 rounded-xl border border-black/10 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-orange" id="confirmNewPassword" type="password" required />
          <button type="button" id="toggleConfirmNewPassword" aria-label="Show password" class="password-toggle-btn">
            <svg id="toggleConfirmNewPasswordIcon" viewBox="0 0 24 24" fill="none"><path d="M1 12S5 4.5 12 4.5 23 12 23 12 19 19.5 12 19.5 1 12 1 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
          </button>
        </div>
      </div>

      <button id="btnChangePassword" type="submit" class="w-full h-14 bg-navy-deep text-white rounded-full font-display font-bold mt-6 border-0 cursor-pointer disabled:opacity-60">Change password</button>

      <div id="passwordStatus" class="mt-4 text-sm hidden"></div>
    </form>
  </div>

  <script src="/static/auth.js?v=3"></script>
  <script>
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const nameForm = document.getElementById('nameForm');
    const btnSaveName = document.getElementById('btnSaveName');
    const nameStatus = document.getElementById('nameStatus');

    const passwordForm = document.getElementById('passwordForm');
    const btnChangePassword = document.getElementById('btnChangePassword');
    const passwordStatus = document.getElementById('passwordStatus');

    setupPasswordToggle('currentPassword', 'toggleCurrentPassword', 'toggleCurrentPasswordIcon');
    setupPasswordToggle('newPassword', 'toggleNewPassword', 'toggleNewPasswordIcon');
    setupPasswordToggle('confirmNewPassword', 'toggleConfirmNewPassword', 'toggleConfirmNewPasswordIcon');

    function showStatus(el, message, isError) {
      el.textContent = message;
      el.classList.remove('hidden', 'text-red-600', 'text-green-700');
      el.classList.add(isError ? 'text-red-600' : 'text-green-700');
    }

    nameForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      nameStatus.classList.add('hidden');
      btnSaveName.disabled = true;
      btnSaveName.textContent = 'Saving…';

      try {
        const res = await authFetch('/api/auth/me', {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: nameInput.value.trim() }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Could not save your name');

        saveSession(getToken(), data);
        showStatus(nameStatus, 'Saved!', false);
      } catch (err) {
        showStatus(nameStatus, err.message, true);
      } finally {
        btnSaveName.disabled = false;
        btnSaveName.textContent = 'Save name';
      }
    });

    passwordForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      passwordStatus.classList.add('hidden');

      const newPassword = document.getElementById('newPassword').value;
      const confirmNewPassword = document.getElementById('confirmNewPassword').value;
      if (newPassword !== confirmNewPassword) {
        showStatus(passwordStatus, 'New passwords do not match.', true);
        return;
      }

      btnChangePassword.disabled = true;
      btnChangePassword.textContent = 'Changing…';

      try {
        const res = await authFetch('/api/auth/change-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            current_password: document.getElementById('currentPassword').value,
            new_password: newPassword,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Could not change your password');

        showStatus(passwordStatus, 'Password changed!', false);
        passwordForm.reset();
      } catch (err) {
        showStatus(passwordStatus, err.message, true);
      } finally {
        btnChangePassword.disabled = false;
        btnChangePassword.textContent = 'Change password';
      }
    });

    (async () => {
      const user = await requireAuth();
      if (!user) return;
      nameInput.value = user.name;
      emailInput.value = user.email;
      document.getElementById('btnBack').addEventListener('click', () => {
        window.location.href = homeUrlForRole(user.role) === '/' ? '/profile' : '/teacher/dashboard';
      });
    })();
  </script>
</body>
</html>
