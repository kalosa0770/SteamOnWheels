<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson — Steam on Wheels</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="screen">
    <div class="top-bar">
      <button class="back-btn" onclick="window.location.href='/'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back
      </button>
      <button class="lang-toggle" id="langToggle">
        <span id="langEng">ENG</span>
        <span id="langBem" class="active">BEM</span>
      </button>
    </div>

    <div class="breadcrumb">
      <span class="route-dot"></span>
      <span class="route-line"></span>
    </div>

    <div class="lesson-subject" id="lessonSubject">Loading…</div>
    <div class="lesson-topic" id="lessonTopic"></div>

    <div class="lesson-card">
      <p class="lesson-body" id="lessonBody">Loading lesson…</p>
    </div>

    <button class="audio-btn" id="btnListenAudio">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 9V15H9L14 20V4L9 9H5Z" fill="currentColor"/><path d="M17.5 8.5C18.5 9.5 19 10.7 19 12C19 13.3 18.5 14.5 17.5 15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span id="audioLabel">Play - Kutikeni ku fyebo</span>
    </button>
  </div>

  <script>
    let isBemba = true;
    let lessonData = null;
    let speechSynth = window.speechSynthesis;
    let currentAudio = null;

    const params = new URLSearchParams(window.location.search);
    const subject = params.get('subject') || 'Science';

    const lessonSubject = document.getElementById('lessonSubject');
    const lessonTopic = document.getElementById('lessonTopic');
    const lessonBody = document.getElementById('lessonBody');
    const btnListenAudio = document.getElementById('btnListenAudio');
    const audioLabel = document.getElementById('audioLabel');
    const langEng = document.getElementById('langEng');
    const langBem = document.getElementById('langBem');

    function updateDisplay() {
      lessonSubject.textContent = subject;
      if (!lessonData) return;

      if (isBemba) {
        lessonTopic.textContent = lessonData.topic_bem;
        lessonBody.textContent = lessonData.content_bem;
        audioLabel.textContent = 'Play - Kutikeni ku fyebo';
        langBem.classList.add('active');
        langEng.classList.remove('active');
      } else {
        lessonTopic.textContent = lessonData.topic_en;
        lessonBody.textContent = lessonData.content_en;
        audioLabel.textContent = 'Play - Listen to Lesson';
        langEng.classList.add('active');
        langBem.classList.remove('active');
      }
    }

    async function loadLesson() {
      try {
        const res = await fetch(`/api/lessons/${encodeURIComponent(subject)}`);
        lessonData = await res.json();
      } catch (err) {
        lessonData = {
          topic_en: 'Could not load lesson',
          topic_bem: 'Tafwile ukusanga amasambililo',
          content_en: 'There was a problem reaching the server. Please try again later.',
          content_bem: 'Kwaliba ubwafya bwa kuya ku seva. Mwesheni na kabili.',
        };
      }
      updateDisplay();
    }

    document.getElementById('langToggle').addEventListener('click', () => {
      isBemba = !isBemba;
      updateDisplay();
    });

    async function playAudio() {
      const text = lessonBody.textContent;
      if (!text) return;

      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }

      const originalLabel = audioLabel.textContent;
      audioLabel.textContent = 'Loading audio…';
      btnListenAudio.disabled = true;

      try {
        const res = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, lang: isBemba ? 'bem' : 'eng' }),
        });

        if (!res.ok) throw new Error('TTS request failed');

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        currentAudio = new Audio(url);
        currentAudio.play();
        currentAudio.onended = () => URL.revokeObjectURL(url);
      } catch (err) {
        // Fallback: browser's built-in voice, English only. If the
        // language is Bemba, there is no good browser fallback — most
        // browsers/OSes simply don't ship a Bemba voice.
        if (!isBemba && speechSynth) {
          speechSynth.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          speechSynth.speak(utterance);
        } else {
          alert('Could not generate audio right now. Please try again in a moment.');
        }
      } finally {
        audioLabel.textContent = originalLabel;
        btnListenAudio.disabled = false;
      }
    }

    btnListenAudio.addEventListener('click', playAudio);

    loadLesson();
  </script>
</body>
</html>
