</svg>
      <span class="font-display font-extrabold text-base leading-tight">STEAM<br><span class="text-[9px] tracking-widest text-orange uppercase font-semibold" style="font-family:'Inter',sans-serif">on wheels</span></span>
    </div>
    <nav class="flex flex-col gap-1">
      <a href="/" class="sidebar-item"><svg viewBox="0 0 24 24" fill="none"><path d="M4 11L12 4L20 11V19C20 19.55 19.55 20 19 20H15V14H9V20H5C4.45 20 4 19.55 4 19V11Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Home</a>
      <a href="/lessons" class="sidebar-item"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5C4 4.67 4.67 4 5.5 4H11V19H5.5C4.67 19 4 18.33 4 17.5V5.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M20 5.5C20 4.67 19.33 4 18.5 4H13V19H18.5C19.33 19 20 18.33 20 17.5V5.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Lessons</a>
      <a href="/progress" class="sidebar-item"><svg viewBox="0 0 24 24" fill="none"><path d="M5 20V12M12 20V6M19 20V15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Progress</a>
      <a href="/profile" class="sidebar-item active"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="2"/><path d="M4.5 20C5.5 16 8.5 14 12 14C15.5 14 18.5 16 19.5 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Profile</a>

    <div class="mt-auto pt-4 border-t border-white/10">

  </aside>
    <div class="flex-1 flex justify-center">
      <div class="w-full max-w-md md:max-w-3xl px-5 md:px-10 pt-8 md:pt-10 pb-28 md:pb-10">
        <div class="bg-orange -mx-5 md:-mx-10 -mt-8 md:-mt-10 px-5 md:px-10 pt-8 md:pt-10 pb-10 rounded-b-[28px] md:rounded-[28px] md:mb-8">
          <div class="flex items-center justify-between">
            <span></span>
            <div class="lang-toggle" id="langToggleTop">
              <span id="langEngTop">ENG</span><span id="langBemTop" class="active">BEM</span>
            </div>
          </div>
          <div class="flex flex-col items-center mt-8 md:mt-10">
            <div class="w-20 h-20 rounded-full bg-white flex items-center justify-center font-display font-bold text-2xl text-navy">MS</div>
            <div class="font-display font-extrabold text-white text-xl mt-4">Micheal Sichuna</div>
          </div>
        </div>

        <div class="flex flex-col gap-4 mt-6 md:mt-0">
          <div class="settings-row">
            <span class="settings-row-label">Language</span>
            <div class="lang-toggle" id="langToggle" onclick="event.stopPropagation()">
              <span id="langEng">ENG</span><span id="langBem" class="active">BEM</span>
            </div>
          </div>

          <button class="settings-row" onclick="alert('Account settings isn\'t built yet — this is a placeholder for the real screen.')">
            <span class="settings-row-label">Account Settings</span><svg class="w-4 h-4 text-navy/40" viewBox="0 0 24 24" fill="none"><path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

          <button class="settings-row" onclick="window.location.href='/lessons'">
            <span class="settings-row-label">Recorded Lessons</span><svg class="w-4 h-4 text-navy/40" viewBox="0 0 24 24" fill="none"><path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

          <button class="w-full h-14 bg-navy-deep text-white rounded-full font-display font-bold mt-2 border-0 cursor-pointer" onclick="if(confirm('Log out?')) window.location.href='/'">Log Out</button>
        </div>

      </div>
    </div>
  </div>
  <nav class="md:hidden fixed bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-md h-16 bg-navy-deep rounded-full flex items-center px-2 shadow-xl z-40">
    <a href="/" class="nav-item"><svg viewBox="0 0 24 24" fill="none"><path d="M4 11L12 4L20 11V19C20 19.55 19.55 20 19 20H15V14H9V20H5C4.45 20 4 19.55 4 19V11Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Home</span></a>
    <a href="/lessons" class="nav-item"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5C4 4.67 4.67 4 5.5 4H11V19H5.5C4.67 19 4 18.33 4 17.5V5.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M20 5.5C20 4.67 19.33 4 18.5 4H13V19H18.5C19.33 19 20 18.33 20 17.5V5.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Lessons</span></a>
    <a href="/progress" class="nav-item"><svg viewBox="0 0 24 24" fill="none"><path d="M5 20V12M12 20V6M19 20V15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Progress</span></a>
    <a href="/profile" class="nav-item active"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="2"/><path d="M4.5 20C5.5 16 8.5 14 12 14C15.5 14 18.5 16 19.5 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Profile</span></a>
  </nav>
  <script>
    // NOTE: "Micheal Sichuna" / "MS" is hardcoded demo data — see comment above.
    let isBemba = true;
    const langEng = document.getElementById('langEng');
    const langBem = document.getElementById('langBem');
    const langEngTop = document.getElementById('langEngTop');
    const langBemTop = document.getElementById('langBemTop');

    function updateLanguage() {
      [langEng, langEngTop].forEach(el => el.classList.toggle('active', !isBemba));
      [langBem, langBemTop].forEach(el => el.classList.toggle('active', isBemba));
    }
    function toggle() { isBemba = !isBemba; updateLanguage(); }
    document.getElementById('langToggle').addEventListener('click', toggle);
    document.getElementById('langToggleTop').addEventListener('click', toggle);
  </script>
</body>
</html>
