<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — Steam on Wheels</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link href="/static/output.css?v=3" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-bg text-navy min-h-screen flex justify-center">
  <div class="w-full max-w-md md:max-w-lg px-5 pt-8 pb-16">
    <div class="flex items-center gap-2 px-2 mb-2">
      <img src="/static/favicon.svg" class="w-10 h-10" />
      <span class="font-display font-extrabold text-base leading-tight text-navy">STEAM<br><span class="text-[9px] tracking-widest text-orange-dark uppercase font-semibold" style="font-family:'Inter',sans-serif">on wheels</span></span>
    </div>

    <div class="mt-6">
      <h1 class="font-display font-extrabold text-2xl mt-2">Create your account</h1>
      <p class="text-navy/55 text-sm mt-2 leading-relaxed">Pupils can view and listen to lessons. Teachers can upload lesson content for the class.</p>
    </div>

    <div class="mt-6">
      <label class="block text-xs font-bold text-navy mb-1.5">I am a…</label>
      <div class="lang-toggle w-full justify-center" id="roleToggle">
        <span id="rolePupil" class="active flex-1 text-center">Pupil</span><span id="roleTeacher" class="flex-1 text-center">Teacher</span>
      </div>
    </div>

    <form id="signupForm">
      <div class="mt-4">
        <label class="block text-xs font-bold text-navy mb-1.5" for="name">Full name</label>
        <input class="w-full px-4 py-3 rounded-xl border border-black/10 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-orange" id="name" placeholder="e.g. Micheal Sichuna" required />
      </div>

      <div class="mt-4">
        <label class="block text-xs font-bold text-navy mb-1.5" for="email">Email</label>
        <input class="w-full px-4 py-3 rounded-xl border border-black/10 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-orange" id="email" type="email" placeholder="you@example.com" required />
      </div>

      <div class="mt-4">
        <label class="block text-xs font-bold text-navy mb-1.5" for="password">Password</label>
        <div class="relative">
          <input class="w-full pl-4 pr-11 py-3 rounded-xl border border-black/10 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-orange" id="password" type="password" placeholder="At least 6 characters" required />
          <button type="button" id="togglePassword" aria-label="Show password" class="password-toggle-btn">
            <svg id="togglePasswordIcon" viewBox="0 0 24 24" fill="none"><path d="M1 12S5 4.5 12 4.5 23 12 23 12 19 19.5 12 19.5 1 12 1 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
          </button>
        </div>
      </div>

      <div class="mt-4">
        <label class="block text-xs font-bold text-navy mb-1.5" for="confirmPassword">Confirm password</label>
        <div class="relative">
          <input class="w-full pl-4 pr-11 py-3 rounded-xl border border-black/10 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-orange" id="confirmPassword" type="password" placeholder="Re-enter your password" required />
          <button type="button" id="toggleConfirmPassword" aria-label="Show password" class="password-toggle-btn">
            <svg id="toggleConfirmPasswordIcon" viewBox="0 0 24 24" fill="none"><path d="M1 12S5 4.5 12 4.5 23 12 23 12 19 19.5 12 19.5 1 12 1 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
          </button>
        </div>
      </div>

      <button id="btnSignup" type="submit" class="w-full h-14 bg-orange hover:bg-orange-dark text-white rounded-full font-display font-bold mt-6 border-0 cursor-pointer disabled:opacity-60">Create account</button>

      <div id="errorText" class="mt-4 text-sm text-red-600 hidden"></div>
    </form>

    <p class="text-center text-navy/55 text-sm mt-6">
      Already have an account?
      <a href="/login" class="text-orange-dark font-semibold">Log in</a>
    </p>
  </div>

  <script src="/static/auth.js?v=3"></script>
  <script>
    (async () => {
      if (getToken()) {
        const user = await requireAuth();
        if (user) window.location.href = homeUrlForRole(user.role);
      }
    })();

    let role = 'pupil';
    const rolePupil = document.getElementById('rolePupil');
    const roleTeacher = document.getElementById('roleTeacher');

    function setRole(newRole) {
      role = newRole;
      rolePupil.classList.toggle('active', role === 'pupil');
      roleTeacher.classList.toggle('active', role === 'teacher');
    }
    rolePupil.addEventListener('click', () => setRole('pupil'));
    roleTeacher.addEventListener('click', () => setRole('teacher'));

    const form = document.getElementById('signupForm');
    const btnSignup = document.getElementById('btnSignup');
    const errorText = document.getElementById('errorText');

    setupPasswordToggle('password', 'togglePassword', 'togglePasswordIcon');
    setupPasswordToggle('confirmPassword', 'toggleConfirmPassword', 'toggleConfirmPasswordIcon');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorText.classList.add('hidden');

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (password !== confirmPassword) {
        errorText.textContent = 'Passwords do not match.';
        errorText.classList.remove('hidden');
        return;
      }

      btnSignup.disabled = true;
      btnSignup.textContent = 'Creating account…';

      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('name').value.trim(),
            email: document.getElementById('email').value.trim(),
            password,
            role,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Sign up failed');

        // Account created — send them to log in with their new credentials
        // rather than signing them straight in.
        window.location.href = `/login?signedUp=1&email=${encodeURIComponent(data.user.email)}`;
      } catch (err) {
        errorText.textContent = err.message;
        errorText.classList.remove('hidden');
      } finally {
        btnSignup.disabled = false;
        btnSignup.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
