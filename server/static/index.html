<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steam on Wheels</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="screen">
    <div class="top-header">
      <button class="brand" onclick="window.location.href='/upload'" title="Teacher access">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 17L9 6H15L20 17" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="7.5" cy="18.5" r="1.5" fill="white"/>
            <circle cx="16.5" cy="18.5" r="1.5" fill="white"/>
          </svg>
        </span>
        <span class="brand-name">STEAM<small>on wheels</small></span>
      </button>
      <button class="lang-toggle" id="langToggle">
        <span id="langEng">ENG</span>
        <span id="langBem" class="active">BEM</span>
      </button>
    </div>

    <div class="greeting" id="greeting">Mwabweleni,
ba Micheal</div>
    <div class="greeting-sub" id="greetingSub">Uyu musango wa lesson wingamusanga pano</div>

    <div class="subjects-section">
      <div class="section-heading">
        <span class="section-title" id="subjectsTitle">Subjects</span>
      </div>

      <div class="subjects-grid">
        <button class="subject-btn" data-subject="Maths">
          <span class="subject-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
              <path d="M12 3V21M8 6L16 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
          MATHS
        </button>
        <button class="subject-btn" data-subject="Literacy">
          <span class="subject-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 5.5C4 4.67 4.67 4 5.5 4H11V19H5.5C4.67 19 4 18.33 4 17.5V5.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              <path d="M20 5.5C20 4.67 19.33 4 18.5 4H13V19H18.5C19.33 19 20 18.33 20 17.5V5.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            </svg>
          </span>
          LITERACY
        </button>
        <button class="subject-btn" data-subject="Science">
          <span class="subject-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9 3H15M10 3V9.5L5.5 18C5 19 5.7 20 6.8 20H17.2C18.3 20 19 19 18.5 18L14 9.5V3" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              <path d="M8 15H16" stroke="currentColor" stroke-width="2"/>
            </svg>
          </span>
          SCIENCE
        </button>
        <button class="subject-btn" data-subject="CTS">
          <span class="subject-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
              <path d="M19.4 13.5c.1-.5.1-1 0-1.5l1.7-1.3-1.5-2.6-2 .6a6 6 0 0 0-1.3-.8l-.3-2.1H10l-.3 2.1c-.5.2-.9.5-1.3.8l-2-.6-1.5 2.6L6.6 12c-.1.5-.1 1 0 1.5l-1.7 1.3 1.5 2.6 2-.6c.4.3.8.6 1.3.8l.3 2.1h4l.3-2.1c.5-.2.9-.5 1.3-.8l2 .6 1.5-2.6-1.7-1.3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            </svg>
          </span>
          CTS
        </button>
      </div>

      <button class="all-lessons-link" id="allLessonsLink">
        <span>Amasambililo yonse</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active">Home</button>
    <button class="nav-item">Lessons</button>
    <button class="nav-item">Progress</button>
    <button class="nav-item">Profile</button>
  </div>

  <script>
    let isBemba = true;

    const greeting = document.getElementById('greeting');
    const greetingSub = document.getElementById('greetingSub');
    const subjectsTitle = document.getElementById('subjectsTitle');
    const allLessonsLink = document.getElementById('allLessonsLink').querySelector('span');
    const langEng = document.getElementById('langEng');
    const langBem = document.getElementById('langBem');

    function updateLanguage() {
      if (isBemba) {
        greeting.textContent = 'Mwabweleni,\nba Micheal';
        greetingSub.textContent = 'Uyu musango wa lesson wingamusanga pano';
        subjectsTitle.textContent = 'Subjects';
        allLessonsLink.textContent = 'Amasambililo yonse';
        langBem.classList.add('active');
        langEng.classList.remove('active');
      } else {
        greeting.textContent = 'Welcome back,\nMicheal';
        greetingSub.textContent = "Pick up where you left off, or start something new";
        subjectsTitle.textContent = 'Subjects';
        allLessonsLink.textContent = 'All lessons';
        langEng.classList.add('active');
        langBem.classList.remove('active');
      }
    }

    document.getElementById('langToggle').addEventListener('click', () => {
      isBemba = !isBemba;
      updateLanguage();
    });

    document.querySelectorAll('.subject-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const subject = btn.getAttribute('data-subject');
        window.location.href = `/lesson?subject=${encodeURIComponent(subject)}`;
      });
    });

    updateLanguage();
  </script>
</body>
</html>
