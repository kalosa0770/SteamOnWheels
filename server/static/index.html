<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steam on Wheels</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style type="text/tailwindcss">
    @theme {
      --color-navy: #0B4A57;
      --color-navy-deep: #073540;
      --color-orange: #FF7A00;
      --color-orange-dark: #E56A00;
      --color-bg: #F0F0F0;
      --font-display: "Baloo 2", sans-serif;
    }
    body { font-family: 'Inter', sans-serif; }
    @layer components {
      .sidebar-item { @apply flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-semibold text-white/55 hover:text-white hover:bg-white/10 transition; }
      .sidebar-item svg { @apply w-5 h-5 shrink-0; }
      .sidebar-item.active { @apply bg-orange text-white; }
      .nav-item { @apply flex-1 h-full flex flex-col items-center justify-center gap-0.5 text-[11px] font-semibold text-white/45; }
      .nav-item svg { @apply w-5 h-5; }
      .nav-item.active { @apply text-white; }
      .subject-btn { @apply bg-white rounded-2xl h-28 md:h-32 flex items-center justify-center text-center font-display font-bold text-navy text-[15px] shadow-sm hover:shadow-lg hover:-translate-y-0.5 transition cursor-pointer border-0 p-3; }
      .lang-toggle { @apply flex items-center gap-1 bg-white border border-black/10 rounded-full p-1 cursor-pointer shrink-0; }
      .lang-toggle span { @apply text-[11px] font-bold px-3 py-1.5 rounded-full text-navy/45 transition; }
      .lang-toggle span.active { @apply bg-orange text-white; }
      .settings-row { @apply w-full flex items-center justify-between bg-white rounded-2xl px-5 py-4 text-left cursor-pointer border-0; }
      .settings-row-label { @apply font-display font-bold text-navy text-[15px]; }
      .progress-card { @apply bg-white rounded-2xl p-5; }
    }
  </style>
</head>
<body class="bg-bg text-navy">
  <div class="min-h-screen flex">
    <aside class="hidden md:flex md:flex-col md:w-64 md:shrink-0 bg-navy-deep text-white px-4 py-6 gap-1">
    <div class="flex items-center gap-2 px-2 mb-6">
      <img src="/static/favicon.svg" class="w-10 h-10" />
      <span class="font-display font-extrabold text-base leading-tight">STEAM<br><span class="text-[9px] tracking-widest text-orange uppercase font-semibold" style="font-family:'Inter',sans-serif">on wheels</span></span>
    </div>
    <nav class="flex flex-col gap-1">
      <a href="/" class="sidebar-item active"><svg viewBox="0 0 24 24" fill="none"><path d="M4 11L12 4L20 11V19C20 19.55 19.55 20 19 20H15V14H9V20H5C4.45 20 4 19.55 4 19V11Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Home</a>
      <a href="/lessons" class="sidebar-item"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5C4 4.67 4.67 4 5.5 4H11V19H5.5C4.67 19 4 18.33 4 17.5V5.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M20 5.5C20 4.67 19.33 4 18.5 4H13V19H18.5C19.33 19 20 18.33 20 17.5V5.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Lessons</a>
      <a href="/progress" class="sidebar-item"><svg viewBox="0 0 24 24" fill="none"><path d="M5 20V12M12 20V6M19 20V15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Progress</a>
      <a href="/profile" class="sidebar-item"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="2"/><path d="M4.5 20C5.5 16 8.5 14 12 14C15.5 14 18.5 16 19.5 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Profile</a>
    </nav>
    <div class="mt-auto pt-4 border-t border-white/10">
      <a href="/upload" class="sidebar-item"><svg viewBox="0 0 24 24" fill="none"><path d="M12 16V4M12 4L7 9M12 4L17 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16V18.5C4 19.3 4.7 20 5.5 20H18.5C19.3 20 20 19.3 20 18.5V16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Teacher access</a>
    </div>
  </aside>
    <div class="flex-1 flex justify-center">
      <div class="w-full max-w-md md:max-w-3xl px-5 md:px-10 pt-8 md:pt-10 pb-28 md:pb-10">
        <div class="flex items-center justify-between md:justify-end">
          <button onclick="location.href='/upload'" title="Teacher access" class="md:hidden flex items-center gap-2 border-0 bg-transparent cursor-pointer">
            <img src="/static/favicon.svg" class="w-7 h-7" />
          </button>
          <div class="lang-toggle" id="langToggle">
            <span id="langEng">ENG</span><span id="langBem" class="active">BEM</span>
          </div>
        </div>

        <h1 id="greeting" class="font-display font-extrabold text-[26px] md:text-4xl mt-6 md:mt-8 leading-snug whitespace-pre-line">Mwabweleni,
ba Micheal</h1>
        <p id="greetingSub" class="text-navy/50 text-sm mt-2"></p>

        <div class="bg-orange rounded-[28px] mt-6 md:mt-8 p-5 md:p-8">
          <h2 id="subjectsTitle" class="font-display font-bold text-white/90 text-xs tracking-widest uppercase">Subjects</h2>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-5">
            <button class="subject-btn" data-subject="Maths">MATHS</button>
            <button class="subject-btn" data-subject="Literacy">LITERACY</button>
            <button class="subject-btn" data-subject="Science">SCIENCE</button>
            <button class="subject-btn" data-subject="CTS">CTS</button>
          </div>
          <button id="allLessonsLink" onclick="location.href='/lessons'" class="w-full text-center text-white font-semibold text-sm mt-6 py-2 border-0 bg-transparent cursor-pointer">Amasambililo yonse &nbsp;→</button>
        </div>

      </div>
    </div>
  </div>
  <nav class="md:hidden fixed bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-md h-16 bg-navy-deep rounded-full flex items-center px-2 shadow-xl z-40">
    <a href="/" class="nav-item active"><svg viewBox="0 0 24 24" fill="none"><path d="M4 11L12 4L20 11V19C20 19.55 19.55 20 19 20H15V14H9V20H5C4.45 20 4 19.55 4 19V11Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Home</span></a>
    <a href="/lessons" class="nav-item"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5C4 4.67 4.67 4 5.5 4H11V19H5.5C4.67 19 4 18.33 4 17.5V5.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M20 5.5C20 4.67 19.33 4 18.5 4H13V19H18.5C19.33 19 20 18.33 20 17.5V5.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Lessons</span></a>
    <a href="/progress" class="nav-item"><svg viewBox="0 0 24 24" fill="none"><path d="M5 20V12M12 20V6M19 20V15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Progress</span></a>
    <a href="/profile" class="nav-item"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="2"/><path d="M4.5 20C5.5 16 8.5 14 12 14C15.5 14 18.5 16 19.5 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Profile</span></a>
  </nav>
  <script>
    let isBemba = true;
    const greeting = document.getElementById('greeting');
    const greetingSub = document.getElementById('greetingSub');
    const subjectsTitle = document.getElementById('subjectsTitle');
    const allLessonsLink = document.getElementById('allLessonsLink');
    const langEng = document.getElementById('langEng');
    const langBem = document.getElementById('langBem');

    function updateLanguage() {
      if (isBemba) {
        greeting.textContent = 'Mwabweleni,\nba Micheal';
        greetingSub.textContent = 'Uyu musango wa lesson wingamusanga pano';
        subjectsTitle.textContent = 'Subjects';
        allLessonsLink.innerHTML = 'Amasambililo yonse&nbsp; →';
        langBem.classList.add('active'); langEng.classList.remove('active');
      } else {
        greeting.textContent = 'Welcome back,\nMicheal';
        greetingSub.textContent = "Pick up where you left off, or start something new";
        subjectsTitle.textContent = 'Subjects';
        allLessonsLink.innerHTML = 'All lessons&nbsp; →';
        langEng.classList.add('active'); langBem.classList.remove('active');
      }
    }
    document.getElementById('langToggle').addEventListener('click', () => { isBemba = !isBemba; updateLanguage(); });
    document.querySelectorAll('.subject-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        window.location.href = `/lesson?subject=${encodeURIComponent(btn.dataset.subject)}`;
      });
    });
    updateLanguage();
  </script>
</body>
</html>
