# fly.toml app configuration file generated for steamonwheels on 2026-08-20T02:42:01Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'steamonwheels'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '2048mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
